name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. File > New site...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WikiForge version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and browser
      description: Browser only matters for problems in generated sites.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Markdown or logs
      description: A minimal article that triggers the problem, or the status bar text.
      render: markdown
