[package]
name = "wikiforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Desktop editor for building interactive, Wikipedia-style static websites"
license = "MIT"
repository = "https://github.com/HyrumHendrickson/WikiForge"
readme = "README.md"
keywords = ["wiki", "static-site", "editor", "egui", "markdown"]
categories = ["gui", "web-programming"]
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "clipboard", "links", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.18"
webbrowser = "1"
